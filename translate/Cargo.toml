[package]
name = "faberline-nlp-translate"
version = "0.1.0"
edition = "2024"
description = "Offline deterministic and seq2seq post-NLP translation over nlp.doc.v1 and nlp.narrative.v1"
license = "MIT"
publish = false

[features]
default = ["narrative"]
narrative = ["dep:faberline-nlp-narrative"]
onnx = ["faberline-nlp/onnx", "dep:tract-onnx", "dep:tokenizers"]
coreml = [
    "faberline-nlp/coreml",
    "dep:tokenizers",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-core-ml",
    "dep:tempfile",
]

[dependencies]
aho-corasick = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
faberline-nlp = { path = ".." }
faberline-nlp-narrative = { path = "../narrative", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = { version = "3", optional = true }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }
tract-onnx = { version = "0.23.10", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-core-ml = { version = "0.3.2", default-features = false, features = ["std", "MLModel", "MLModel_MLModelCompilation", "MLModelConfiguration", "MLMultiArray", "MLFeatureValue", "MLFeatureProvider", "MLDictionaryFeatureProvider", "MLPredictionOptions", "block2"], optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSString", "NSURL", "NSValue", "NSObject"], optional = true }

[dev-dependencies]
tempfile = "3"
