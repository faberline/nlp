[package]
name = "faberline-nlp-narrative"
version = "0.1.0"
edition = "2024"
description = "Source-linked narrative event and timeline graph over nlp.doc.v1"
license = "MIT"
publish = false

[dependencies]
aho-corasick = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
faberline-nlp = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
