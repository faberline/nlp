[package]
name = "faberline-nlp"
version = "0.1.0"
edition = "2024"
description = "Source-linked English and Chinese text analysis"
repository = "https://github.com/faberline/nlp"
publish = false

[workspace]
members = ["cnl"]

[features]
model-tokenizer = ["dep:tiktoken-rs"]
onnx = ["dep:tract-onnx", "dep:tokenizers"]

[dependencies]
aho-corasick = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
faberline-nlp-cnl = { path = "cnl" }
icu_locale_core = "2.3"
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data"] }
jieba-rs = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiktoken-rs = { version = "0.9", optional = true }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }
tract-onnx = { version = "0.23.10", default-features = false, optional = true }
unicode-segmentation = "1"

[dev-dependencies]
pest = "2.9"
tempfile = "3"
