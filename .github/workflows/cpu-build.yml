name: CPU package build
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            rustflags: ''
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            rustflags: ''
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
    runs-on: ${{ matrix.runner }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Check native architecture
        shell: bash
        run: |
          case '${{ matrix.target }}' in
            aarch64-apple-darwin) test "$(uname -m)" = arm64 ;;
            x86_64-apple-darwin) test "$(uname -m)" = x86_64 ;;
            x86_64-pc-windows-msvc) test "$PROCESSOR_ARCHITECTURE" = AMD64 ;;
          esac
      - name: Build CPU CLI
        run: cargo build --release --locked --workspace --bins --target ${{ matrix.target }}
      - name: Capture locked target dependency metadata
        shell: bash
        run: cargo metadata --locked --format-version 1 --filter-platform '${{ matrix.target }}' > cpu-metadata.json
      - name: Inspect runtime imports
        shell: bash
        run: |
          exe=nlp
          py=python3
          if [[ '${{ matrix.target }}' == *windows* ]]; then exe=nlp.exe; py=python; fi
          "$py" scripts/release/inspect_runtime.py "target/${{ matrix.target }}/release/$exe" '${{ matrix.target }}' runtime-dependencies.txt
      - name: Package
        shell: bash
        run: |
          exe=nlp
          py=python3
          if [[ '${{ matrix.target }}' == *windows* ]]; then exe=nlp.exe; py=python; fi
          "$py" scripts/release/package.py "target/${{ matrix.target }}/release/$exe" '${{ matrix.target }}' dist cpu-metadata.json runtime-dependencies.txt '${{ matrix.rustflags }}'
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpu-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - name: Download this job's uploaded CPU artifact
        uses: ./.github/actions/download-cpu-artifact
        with:
          artifact-id: ${{ steps.upload.outputs.artifact-id }}
      - name: Verify downloaded archive and execute all commands
        shell: bash
        env:
          UPLOAD_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          py=python3
          if [[ "$RUNNER_OS" == Windows ]]; then py=python; fi
          "$py" -m unittest discover -s scripts/release -p test_verify_artifact.py
          "$py" scripts/release/verify_artifact.py raw-download "$UPLOAD_DIGEST" dist '${{ matrix.target }}' "$(git rev-parse HEAD)" 'target/${{ matrix.target }}/release'
  cpu-package-gate:
    name: cpu-package-gate
    if: always()
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Require every native package job
        env:
          RESULT: ${{ needs.package.result }}
        run: test "$RESULT" = success
