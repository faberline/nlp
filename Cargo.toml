[package]
name = "faberline-nlp"
version = "0.1.0"
edition = "2024"
description = "Source-linked Chinese narrative analysis and English CNL parsing"
repository = "https://github.com/faberline/nlp"
publish = false

[workspace]
members = ["cnl"]

[features]
model-tokenizer = ["dep:tiktoken-rs"]

[dependencies]
anyhow = "1"
faberline-nlp-cnl = { path = "cnl" }
serde = { version = "1", features = ["derive"] }
tiktoken-rs = { version = "0.9", optional = true }

[dev-dependencies]
pest = "2.9"
