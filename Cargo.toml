[package]
name = "faberline-nlp"
version = "0.1.0"
edition = "2024"
description = "Source-linked English and Chinese text analysis"
repository = "https://github.com/faberline/nlp"
publish = false

[workspace]
members = ["cnl"]

[features]
model-tokenizer = ["dep:tiktoken-rs"]
onnx = ["dep:tract-onnx", "dep:tokenizers"]
coreml = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-core-ml", "dep:tempfile"]

[dependencies]
aho-corasick = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
faberline-nlp-cnl = { path = "cnl" }
icu_locale_core = "2.3"
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data"] }
jieba-rs = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiktoken-rs = { version = "0.9", optional = true }
tempfile = { version = "3", optional = true }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }
tract-onnx = { version = "0.23.10", default-features = false, optional = true }
unicode-segmentation = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-core-ml = { version = "0.3.2", default-features = false, features = ["std", "MLModel", "MLModel_MLModelCompilation", "MLModelConfiguration", "MLMultiArray", "MLFeatureValue", "MLFeatureProvider", "MLDictionaryFeatureProvider", "MLPredictionOptions", "block2"], optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSString", "NSURL", "NSValue", "NSObject"], optional = true }

[dev-dependencies]
pest = "2.9"
tempfile = "3"
