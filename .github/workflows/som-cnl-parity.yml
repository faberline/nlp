name: SOM CNL parser parity
on:
  push:
    branches: [codex/som-nlp-cnl-parity]
permissions:
  contents: read
jobs:
  compare:
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: faberline/som
          ref: 05c63d08275d59ea7110cd8f2b30786070b91968
          path: som
          persist-credentials: false
      - name: Prepare exact source trees
        run: |
          set -euo pipefail
          git -C som worktree add --detach "$RUNNER_TEMP/som-baseline" HEAD
          git -C som apply --check "$GITHUB_WORKSPACE/verify/som.patch"
          git -C som apply "$GITHUB_WORKSPACE/verify/som.patch"
          mkdir -p som/som-rs/vendor
          cp -R cnl som/som-rs/vendor/faberline-nlp-cnl
          cp verify/vendor-readme.md som/som-rs/vendor/faberline-nlp-cnl/README.md
          for tree in "$RUNNER_TEMP/som-baseline" "$GITHUB_WORKSPACE/som"; do
            mkdir -p "$tree/som-rs/som-targets/tests"
            cp verify/cnl_parity.rs "$tree/som-rs/som-targets/tests/cnl_parity.rs"
          done
          git -C som diff --check
          shasum -a 256 verify/som.patch cnl/Cargo.toml cnl/src/lib.rs cnl/src/som_cnl.pest
      - name: Install the frozen public macOS tools
        working-directory: som
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 806ab0fae7a5b8433fab978f35730c28fdc91abc
          python3 som-rs/scripts/react_output_acceptance/provision_macos.py --out "$RUNNER_TEMP/som-cnl-tools"
          printf '%s\n' '/opt/homebrew/Cellar/rust/1.96.1/bin' >> "$GITHUB_PATH"
      - name: Verify and unpack the public formatter archives
        run: |
          set -euo pipefail
          curl -fLsS https://github.com/astral-sh/ruff/releases/download/0.16.6/ruff-aarch64-apple-darwin.tar.gz -o "$RUNNER_TEMP/ruff.tar.gz"
          printf '%s  %s\n' 77513748c833b435b82453ba20e07db808ef6c5121945ede80a6cf21bee468a4 "$RUNNER_TEMP/ruff.tar.gz" | shasum -a 256 -c
          tar -xzf "$RUNNER_TEMP/ruff.tar.gz" -C "$RUNNER_TEMP"
          curl -fLsS https://registry.npmjs.org/prettier/-/prettier-3.9.10.tgz -o "$RUNNER_TEMP/prettier.tgz"
          printf '%s  %s\n' 9dc72045591793dff972432fb78722f7ab91aaa90a7fa8c1261ede55969246b7 "$RUNNER_TEMP/prettier.tgz" | shasum -a 256 -c
          mkdir "$RUNNER_TEMP/prettier"
          tar -xzf "$RUNNER_TEMP/prettier.tgz" -C "$RUNNER_TEMP/prettier" --strip-components 1
          printf 'SOM_PARITY_RUFF=%s\nSOM_TS_PRETTIER=%s\n' "$RUNNER_TEMP/ruff-aarch64-apple-darwin/ruff" "$RUNNER_TEMP/prettier" >> "$GITHUB_ENV"
      - name: Run the original Rust suites on both source trees
        run: |
          set -uo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/som-cargo-target"
          export SOM_PARITY_ASSETS="$RUNNER_TEMP/assets-not-used-for-unit-tests"
          result=0
          for tree in "$RUNNER_TEMP/som-baseline" "$GITHUB_WORKSPACE/som"; do
            echo "Source tree: $tree"
            cargo test --locked --manifest-path "$tree/som-rs/Cargo.toml" || result=1
            cargo test --locked --manifest-path "$tree/som-rs/som-targets/Cargo.toml" --lib --bins || result=1
          done
          exit "$result"
      - name: Compare the same CNL inputs byte for byte
        if: success() || failure()
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/som-cargo-target"
          for side in baseline candidate; do
            tree="$GITHUB_WORKSPACE/som"
            if [[ "$side" == baseline ]]; then tree="$RUNNER_TEMP/som-baseline"; fi
            SOM_PARITY_ASSETS="$RUNNER_TEMP/$side-assets" SOM_PARITY_REPORT="$RUNNER_TEMP/$side.json" \
              cargo test --locked --manifest-path "$tree/som-rs/som-targets/Cargo.toml" --test cnl_parity
          done
          python3 - "$RUNNER_TEMP/baseline.json" "$RUNNER_TEMP/candidate.json" <<'PY'
          import collections, json, pathlib, sys
          before, after = [json.loads(pathlib.Path(arg).read_bytes()) for arg in sys.argv[1:]]
          diffs = [key for key in sorted(before.keys() | after.keys()) if before.get(key) != after.get(key)]
          failures = [(key, value["assemble_error"]) for key, value in after.items() if "assemble_error" in value]
          counts = collections.Counter(
              (key.split("/", 1)[0], "files" if "files" in value else "refused" if "compile_error" in value else "assemble_error")
              for key, value in after.items()
          )
          print("Target results:", sorted(counts.items()))
          print("Compared records:", len(after), "Differences:", len(diffs), "Assembly errors:", len(failures))
          for key in diffs[:20]:
              old, new = before.get(key, {}), after.get(key, {})
              changed = [field for field in sorted(old.keys() | new.keys()) if old.get(field) != new.get(field)]
              print("Difference:", key, changed)
          for key, error in failures[:20]:
              print("Assembly error:", key, error)
          if diffs or failures:
              sys.exit(1)
          PY
